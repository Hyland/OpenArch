name: 'Generate Version'
description: 'Generate semantic version from VERSION with automatic patch increment'
outputs:
  version:
    description: 'Generated version string'
    value: ${{ steps.version.outputs.version }}
  semantic-version:
    description: 'Semantic version (major.minor.patch)'
    value: ${{ steps.version.outputs.semantic-version }}
  full-version:
    description: 'Full version with metadata'
    value: ${{ steps.version.outputs.full-version }}

runs:
  using: 'composite'
  steps:
    - name: Generate version
      id: version
      shell: bash
      run: |
        VERSION_FILE="VERSION"

        if [ ! -f "$VERSION_FILE" ]; then
          echo "Missing $VERSION_FILE file" >&2
          exit 1
        fi

        MAJOR_MINOR=$(tr -d '\r\n' < "$VERSION_FILE")

        if ! [[ "$MAJOR_MINOR" =~ ^[0-9]+\.[0-9]+$ ]]; then
          echo "VERSION must contain exactly MAJOR.MINOR, found: $MAJOR_MINOR" >&2
          exit 1
        fi

        ANCHOR=$(git log -1 --format=%H -- "$VERSION_FILE")
        if [ -z "$ANCHOR" ]; then
          echo "Could not determine the last commit that updated $VERSION_FILE" >&2
          exit 1
        fi

        PATCH_VERSION=$(git rev-list --count "${ANCHOR}..HEAD")
        SEMANTIC_VERSION="${MAJOR_MINOR}.${PATCH_VERSION}"

        # Get current branch name
        if [ "${{ github.event_name }}" == "pull_request" ]; then
          BRANCH_NAME="${{ github.event.pull_request.head.ref }}"
          EVENT_TYPE="pull_request"
        else
          BRANCH_NAME="${{ github.ref_name }}"
          EVENT_TYPE="push"
        fi

        # Get short SHA
        SHORT_SHA=$(git rev-parse --short HEAD)

        # Generate version based on context
        if [ "$EVENT_TYPE" == "pull_request" ]; then
          # For PR: semantic-version-PullRequestXXXX.Y-runid
          PR_NUMBER="${{ github.event.pull_request.number }}"
          PR_COMMITS="${{ github.event.pull_request.commits }}"
          VERSION="${SEMANTIC_VERSION}-PullRequest${PR_NUMBER}.${PR_COMMITS}-${{ github.run_id }}"
          FULL_VERSION="$VERSION"
        elif [ "$BRANCH_NAME" == "master" ] || [ "$BRANCH_NAME" == "main" ]; then
          # For master: clean semantic version
          VERSION="$SEMANTIC_VERSION"
          FULL_VERSION="$SEMANTIC_VERSION"
        else
          # For feature branches: semantic-version-branchname-runid
          CLEAN_BRANCH=$(echo "$BRANCH_NAME" | sed -e 's/[^-_.[:alnum:]]/_/g')
          VERSION="${SEMANTIC_VERSION}-${CLEAN_BRANCH}-${{ github.run_id }}"
          FULL_VERSION="$VERSION"
        fi

        # Clean version for docker tags (replace invalid characters)
        CLEAN_VERSION=$(echo "$VERSION" | sed -e 's/[^-_.[:alnum:]]/_/g')

        echo "Version file: $VERSION_FILE"
        echo "Major.minor: $MAJOR_MINOR"
        echo "Anchor commit: $ANCHOR"
        echo "Patch version: $PATCH_VERSION"
        echo "Semantic version: $SEMANTIC_VERSION"
        echo "Generated version: $VERSION"
        echo "Clean version: $CLEAN_VERSION"
        echo "Full version: $FULL_VERSION"

        # Set outputs
        echo "version=$CLEAN_VERSION" >> $GITHUB_OUTPUT
        echo "semantic-version=$SEMANTIC_VERSION" >> $GITHUB_OUTPUT
        echo "full-version=$FULL_VERSION" >> $GITHUB_OUTPUT
