name: Update versions

on:
  workflow_dispatch:
  schedule:
    - cron: "5 8 * * 0"

jobs:
  update-apk-packages:
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Update pinned apk packages
        uses: updatecli/updatecli-action@5bda7da77bf4d181bce5f807d73d832b62062acf # v3.3.0

      - name: Run Updatecli in Dry Run mode
        env:
          UPDATECLI_GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
        run: updatecli diff --config ./updatecli.d/apk-packages.yml

      - name: Run Updatecli in apply mode
        env:
          UPDATECLI_GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
        run: updatecli apply --config ./updatecli.d/apk-packages.yml

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: update/apk-package-version
          labels: dependencies
          body: "New Alpine package versions are available for pinned Dockerfile apk dependencies"
          title: "Bump pinned apk package versions"
        env:
          GITHUB_TOKEN : ${{ secrets.GITHUB_TOKEN }}
