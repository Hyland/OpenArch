name: Update versions

on:
  workflow_dispatch:
  schedule:
    - cron: "5 8 * * 0"

jobs:
  update-apk-packages:
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Update pinned apk packages
        uses: updatecli/updatecli-action@e71be7554f3f940bc439cf720b3e4e379823c562 # v3.2.0

      - name: Run Updatecli in Dry Run mode
        env:
          UPDATECLI_GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
        run: updatecli diff --config ./updatecli.d/apk-packages.yml

      - name: Run Updatecli in apply mode
        env:
          UPDATECLI_GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
        run: updatecli apply --config ./updatecli.d/apk-packages.yml

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: update/apk-package-version
          labels: dependencies
          body: "New Alpine package versions are available for pinned Dockerfile apk dependencies"
          title: "Bump pinned apk package versions"
        env:
          GITHUB_TOKEN : ${{ secrets.GITHUB_TOKEN }}
