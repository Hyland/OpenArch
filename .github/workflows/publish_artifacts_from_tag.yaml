name: Publish HxPR artifacts to GH packages from a provided tag

on:
  workflow_dispatch:
    inputs:
      hxpr-tag-version:
        type: string
        description: hxpr tag version to publish artifacts from
        required: true
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
permissions:
  actions: read
  contents: write
  packages: write
  id-token: write
  security-events: write
  pull-requests: write
env:
  GH_ACTOR: hxpcscicduser
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  build:
    name: Build project and publish artifacts to GH packages
    if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/internal' }}
    runs-on: ubuntu-latest
    outputs:
      version: ${{ env.VERSION }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          ref: ${{ inputs.hxpr-tag-version }}

      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-
      - name: Set up JDK 25
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version: '25'
          distribution: 'corretto'
          server-id: hylandsoftware-github
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
      - name: Maven Settings (inc Nexus)
        uses: ./.github/actions/setup-maven
        with:
          nexus-username: ${{ secrets.NEXUS_USERNAME }}
          nexus-password: ${{ secrets.NEXUS_PASSWORD }}
      - name: Compile project
        run: mvn clean install -DskipTests

      - name: Publish to GH Packages
        env:
          GH_ACTOR: ${{ env.GH_ACTOR }}
          GITHUB_TOKEN: ${{ secrets.GH_TEST_PAT_SYNC }}
        run: |
          mvn --batch-mode deploy \
            -DskipTests \
            -Prelease \
            -DrepositoryId=ghcr.io \
            -Ddistribution-repository.url=https://maven.pkg.github.com/HylandSoftware/hxpr-community-internal

  notify:
    runs-on: ubuntu-slim
    needs:
      - build
    if: always() && failure()
    steps:
      - name: Teams Notification
        uses: Alfresco/alfresco-build-tools/.github/actions/send-teams-notification@684d64a56c85be82826d46ea1b95fa7c11dcc10c # v18.5.0
        with:
          webhook-url: ${{ secrets.TEAMS_GA_NOTIFS_WEBHOOK_URL }}
