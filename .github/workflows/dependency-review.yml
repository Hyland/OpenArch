name: Dependency Review

on:
  pull_request:
    types: [ opened, synchronize, reopened ]
    branches:
      - main

permissions:
  contents: read
  pull-requests: write

jobs:
  dependency-review:
    name: Dependency Review
    if: contains(github.event.pull_request.labels.*.name, 'dependencies')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: always
          license-check: true
          allow-licenses: ANTLR-PD, Apache-2.0, BlueOak-1.0.0, 0BSD, BSD-2-Clause-Patent, BSD-2-Clause, BSD-3-Clause-Clear, BSD-3-Clause, BSD-4-Clause, BSL-1.0, CATOSL-1.1, CC0-1.0, ICU, ISC, libtiff, MS-PL, MIT-0, MIT, PostgreSQL, PSF-2.0
