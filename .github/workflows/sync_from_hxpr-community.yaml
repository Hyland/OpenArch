name: Sync from hyland-community project

on:
  workflow_dispatch:
  schedule:
    - cron: '00 10 * * MON-FRI'

env:
  GH_ACTOR: hxpcscicduser
  GH_ACTOR_EMAIL: "noreply@hyland.com"
  GH_TOKEN: ${{ secrets.GH_CI_CD_PAT }}

jobs:
  sync-from-hyland-community-main-branch:
    name: Sync between hxpr-community 'main' branch and hxpr-community-internal 'main' branch
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Sync with 'main' branch of hyland-community
        id: sync
        run: |
          git config user.name "${{ env.GH_ACTOR }}"
          git config user.email "<${{ env.GH_ACTOR_EMAIL }}>"
          git config --global url.https://${{ env.GH_TOKEN }}@github.com/.insteadOf https://github.com/
          git remote add upstream https://github.com/HylandSoftware/hxpr-community.git
          git fetch upstream && git rebase upstream/main

      - name: Push changes
        id: push
        if : ${{ steps.sync.outcome == 'success' }}
        run: git push origin main --force-with-lease
