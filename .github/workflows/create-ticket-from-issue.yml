name: Create ticket from OpenArch issue

on:
  issues:
    types: [ opened ]

# Hardening: the job doesn't use GITHUB_TOKEN, so it gets no permissions
permissions: {}

jobs:
  create-ticket:
    name: Create ticket
    runs-on: ubuntu-slim
    env:
      # Scoped API tokens only work through the API gateway, which requires the site's cloud ID
      JIRA_BASE_URL: https://api.atlassian.com/ex/jira/252cce86-035e-4b0e-abd2-3c002935632f
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      ISSUE_URL: ${{ github.event.issue.html_url }}
      JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
    steps:
      - name: Create ticket
        run: |
          payload="$(jq -n \
            --arg summary "Address OpenArch issue #${ISSUE_NUMBER}" \
            --arg url "$ISSUE_URL" \
            '{fields: {
              project: {key: "HXCS"},
              issuetype: {name: "Task"},
              parent: {key: "HXCS-7052"},
              labels: ["OpenArch", "GitHub"],
              summary: $summary,
              description: {type: "doc", version: 1, content: [
                {type: "paragraph", content: [
                  {type: "text", text: $url, marks: [{type: "link", attrs: {href: $url}}]}
                ]},
                {type: "paragraph", content: [
                  {type: "text", text: "Be sure to set the ticket type appropriately:"}
                ]},
                {type: "bulletList", content: [
                  {type: "listItem", content: [{type: "paragraph", content: [
                    {type: "text", text: "Task, when it can be addressed without code changes (ex: answering a question)."}]}]},
                  {type: "listItem", content: [{type: "paragraph", content: [
                    {type: "text", text: "Bug, when it can be addressed by merging a bugfix (ex: a feature is not working correctly)."}]}]},
                  {type: "listItem", content: [{type: "paragraph", content: [
                    {type: "text", text: "Story, for any other resolution that requires merging code changes (ex: a feature request)."}]}]}
                ]}
              ]}
            }}')"
          curl --fail-with-body -sS -X POST "${JIRA_BASE_URL}/rest/api/3/issue" \
            -H "Authorization: Bearer ${JIRA_API_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "$payload"
