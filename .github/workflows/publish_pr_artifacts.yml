name: Publish PR-tagged artifacts

on:
  pull_request:
    types: [ opened, synchronize, reopened, labeled ]
    branches:
      - main
    paths:
      - 'modules/**'
      - 'server/**'
      - 'sonarcloud/**'
      - 'pom.xml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Publish PR-tagged artifacts
    if: contains(github.event.pull_request.labels.*.name, 'publish')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up JDK 25
        uses: actions/setup-java@1bcf9fb12cf4aa7d266a90ae39939e61372fe520 # v5.4.0
        with:
          java-version: '25'
          distribution: 'corretto'
          cache: 'maven'
          server-id: hylandsoftware-github
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD

      - name: Maven Settings (inc Nexus)
        uses: ./.github/actions/setup-maven
        with:
          nexus-username: ${{ secrets.NEXUS_USERNAME }}
          nexus-password: ${{ secrets.NEXUS_PASSWORD }}

      - name: Compute PR version
        id: pr-version
        shell: bash
        run: |
          # strip -SNAPSHOT from the current parent pom version to use as the base
          BASE_VERSION=$(mvn -q -Dexec.executable=echo -Dexec.args='${project.version}' \
            --non-recursive exec:exec | sed 's/-SNAPSHOT$//')
          PR_NUMBER="${{ github.event.pull_request.number }}"
          VERSION="${BASE_VERSION}-PR${PR_NUMBER}-SNAPSHOT"
          echo "Computed PR version: ${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Set Maven project version
        run: |
          mvn --batch-mode versions:set \
            -DnewVersion='${{ steps.pr-version.outputs.version }}' \
            -DprocessAllModules=true \
            -DgenerateBackupPoms=false

      - name: Build and publish
        env:
          GH_ACTOR: hxpcscicduser
          GITHUB_TOKEN: ${{ secrets.GH_CI_CD_PAT }}
        run: |
          mvn --batch-mode -T1C clean deploy \
            -DskipTests \
            -DrepositoryId=ghcr.io \
            -Ddistribution-repository.url=https://maven.pkg.github.com/HylandSoftware/hxpr-community-internal
