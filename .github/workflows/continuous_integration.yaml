name: Continuous Integration - Build and release the HXPR Community project. Trigger the CD workflow.

on:
  push:
    branches:
      - main
  pull_request:
    types: [ opened, synchronize ]
    branches:
      - main
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
permissions:
  actions: read
  contents: write
  packages: write
  id-token: write
  security-events: write
  pull-requests: write
env:
  GH_ACTOR: hxpcscicduser
  GHCR: ghcr.io/hylandsoftware/
  IMAGE_NAME: hxpr-community-internal-app-jvm

jobs:
  prepare_build:
    name: Prepare Build Metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - name: Ensure SHA pinned actions
        uses: zgosalvez/github-actions-ensure-sha-pinned-actions@3db98c0363e2fa5df3e1c4c471777a7c10b24cc9 # v5.0.5
      - name: Generate Version
        id: version
        uses: ./.github/actions/generate-version
        with:
          base-version: '0.0'
  build:
    name: Build and Test Docker Image
    runs-on: ubuntu-latest
    needs:
      - prepare_build
    env:
      VERSION_BUILD: ${{ needs.prepare_build.outputs.version }}
      BRUNO_TEST_DIR: "./ftests/bruno-tests"
      BRUNO_REPORTS_DIR: "localTestResults"
    outputs:
      version: ${{ env.VERSION }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Ensure SHA pinned actions
        uses: zgosalvez/github-actions-ensure-sha-pinned-actions@3db98c0363e2fa5df3e1c4c471777a7c10b24cc9 # v5.0.5
      - name: Login to ghcr.io in read only mode
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GH_HS_HX_RO_CLASSIC_TOKEN }}

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-
      - name: Set up JDK 25
        uses: actions/setup-java@1bcf9fb12cf4aa7d266a90ae39939e61372fe520 # v5.4.0
        with:
          java-version: '25'
          distribution: 'corretto'
          server-id: hylandsoftware-github
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
      - name: Maven Settings (inc Nexus)
        uses: ./.github/actions/setup-maven
        with:
          nexus-username: ${{ secrets.NEXUS_USERNAME }}
          nexus-password: ${{ secrets.NEXUS_PASSWORD }}
      - name: Read current pom version
        # Captures the SNAPSHOT version from pom.xml; release.sh (when run on main)
        # will strip the -SNAPSHOT suffix to produce the released version.
        run: echo "POM_VERSION=$(mvn -B -q -DforceStdout -Dexpression=project.version help:evaluate)" >> $GITHUB_ENV
      - name: Compile project
        run: mvn clean install -DskipTests
      - name: Set BRANCH_NAME and GITHUB_PR
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "BRANCH_NAME=${GITHUB_HEAD_REF}" >> $GITHUB_ENV
            echo "GITHUB_PR=true" >> $GITHUB_ENV
          else
            echo "BRANCH_NAME=${GITHUB_REF#refs/heads/}" >> $GITHUB_ENV
            echo "GITHUB_PR=false" >> $GITHUB_ENV
          fi
      - name: Release new HxPR version
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          RELEASE_USERNAME: ${{ env.GH_ACTOR }}
          RELEASE_USER_PAT: ${{ secrets.GH_CI_CD_PAT }}
          RELEASE_USER_EMAIL: "noreply@hyland.com"
          RELEASE_PREPARE: true
          RELEASE_PERFORM: true
          DISTRIBUTION_REPO_URL: https://maven.pkg.github.com/HylandSoftware/hxpr-community-internal
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: _ci/release.sh

      - name: Rebuild modules after release version bump
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: mvn clean install -DskipTests
      - name: Resolve VERSION from release.sh / pom
        # On push to main, release.sh strips -SNAPSHOT to compute the released version
        # and bumps the pom to the next SNAPSHOT. On PRs / other events, fall back to
        # the SNAPSHOT version read from the pom (release.sh did not run).
        run: |
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
            VERSION="${POM_VERSION%-SNAPSHOT}"
          else
            VERSION="${VERSION_BUILD}"
          fi
          echo "VERSION=${VERSION}" >> $GITHUB_ENV

      - name: Set Product version to current build
        run: sed -i 's/^org\.nuxeo\.ecm\.product\.version=.*$/org\.nuxeo\.ecm\.product\.version=${{ env.VERSION }}/g' ./server/hxpr-community-internal-app/src/main/resources/application.properties
      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          driver: docker-container
          # apply fix from https://github.com/moby/buildkit/issues/3969
          driver-opts: |
            network=host
      - name: Docker Compose Up
        id: compose
        working-directory: ./server/hxpr-community-internal-app
        run: docker compose up --quiet-pull -d
      - name: Build HxPR Community Server with Maven
        run: |
          # Skip enforcer on PRs to allow SNAPSHOT dependencies from in-flight upstream PRs.
          mvn --no-transfer-progress -nsu verify \
          -f server/hxpr-community-internal-app -Plicense-check \
          -Dnuxeo.mongodb.server=$MONGODB_HOST:$MONGODB_PORT \
          -Dnuxeo.mongodb.dbname=unittests \
          ${{ github.event_name == 'pull_request' && '-Dnuxeo.skip.enforcer=true' || '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # use localhost for the host here because we are running the job on the VM.
          MONGODB_HOST: localhost
          MONGODB_PORT: 27017
      - name: Replace SNAPSHOT JAR with released artifact for Docker
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          RELEASE_VERSION="${POM_VERSION%-SNAPSHOT}"
          TARGET_DIR="server/hxpr-community-internal-app/target"
          # Remove the next-SNAPSHOT jar produced by mvn verify (e.g. 0.0.72-SNAPSHOT)
          rm -f "${TARGET_DIR}"/hxpr-community-internal-app-*-SNAPSHOT.jar
          # Copy the released jar (e.g. 0.0.71) from the local Maven repository,
          # populated by release:perform during the release.sh step
          cp ~/.m2/repository/com/hyland/hxpr/hxpr-community-internal-app/${RELEASE_VERSION}/hxpr-community-internal-app-${RELEASE_VERSION}.jar \
             "${TARGET_DIR}/hxpr-community-internal-app-${RELEASE_VERSION}.jar"

      - name: Login to ghcr.io in read only mode
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GH_HS_HX_RO_CLASSIC_TOKEN }}

      - name: "Run mvn license plugin"
        run: mvn -nsu license:aggregate-add-third-party
      - name: "Download licenses"
        run: mvn -nsu license:aggregate-download-licenses -DlicensesOutputDirectory=./server/hxpr-community-internal-app/target/licenses
      - name: "Clone Alfresco/third-party-license-overrides"
        run: git clone --depth=1 https://github.com/Alfresco/third-party-license-overrides.git
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
      - name: "Create third party license csv file and add it to the docker compose root directory"
        run: |
          python3 ./third-party-license-overrides/thirdPartyLicenseCSVCreator.py --project "${{ github.workspace }}" \
          --version "${{ env.VERSION }}" --combined --output "./server/hxpr-community-internal-app/target"

      - name: Build Docker Image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./server/hxpr-community-internal-app
          file: ./server/hxpr-community-internal-app/src/main/docker/Dockerfile
          tags: ghcr.io/hylandsoftware/${{ env.IMAGE_NAME }}:${{ env.VERSION }}
          platforms: linux/amd64,linux/arm64
          push: false
          build-args: |
            BUILD_DATE=$(date -u "+%Y-%m-%dT%H:%M:%S")
            COMMIT_SHA=${{ github.sha }}
            BUILD_URL=https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

      - name: Login to ghcr.io in write mode
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Docker Image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./server/hxpr-community-internal-app
          file: ./server/hxpr-community-internal-app/src/main/docker/Dockerfile
          tags: ghcr.io/hylandsoftware/${{ env.IMAGE_NAME }}:${{ env.VERSION }}
          platforms: linux/amd64,linux/arm64
          push: true

      - name: Run Docker Image
        run: |
          docker run --rm -d -p 8080:8080 --name=HXPR_COMMUNITY_APP --network="host" \
          -e NUXEO_MONGODB_SERVER=$MONGODB_HOST:$MONGODB_PORT \
          -e NUXEO_DATA_DIR=/tmp \
          ghcr.io/hylandsoftware/${{ env.IMAGE_NAME }}:${{ env.VERSION }}
        env:
          # use localhost for the host here because we are running the job on the VM.
          MONGODB_HOST: localhost
          MONGODB_PORT: 27017
      - name: Wait for availability
        uses: ./.github/actions/wait-for-availability
        with:
          url: http://localhost:8080
      - name: Install Bruno CLI
        run: npm install -g @usebruno/cli@3.5.0 --ignore-scripts
      - name: Prepare Test Results
        working-directory: ${{ env.BRUNO_TEST_DIR }}
        run: mkdir -p ${BRUNO_REPORTS_DIR}
      - name: Run Bruno collection
        if: github.event_name == 'pull_request'
        working-directory: ${{ env.BRUNO_TEST_DIR }}
        run: |
          bru run --env-file environments/community.localhost.json \
            --reporter-html ${BRUNO_REPORTS_DIR}/bruno_test_report.html
      - name: Retrieve Docker Logs
        if: github.event_name == 'pull_request'
        working-directory: ${{ env.BRUNO_TEST_DIR }}
        run: docker logs HXPR_COMMUNITY_APP >> ${BRUNO_REPORTS_DIR}/hxpr_docker_logs.txt
      - name: Dump docker logs on failure
        if: github.event_name == 'pull_request' && failure()
        uses: jwalton/gh-docker-logs@2741064ab9d7af54b0b1ffb6076cf64c16f0220e # v2.2.2
      - name: Stop Docker Image
        run: docker stop HXPR_COMMUNITY_APP
      - name: Docker Compose Down
        if: steps.compose.conclusion == 'success'
        working-directory: server/hxpr-community-internal-app
        run: docker compose down
      # Upload the contents of test results directory to workspace
      - name: Upload Bruno test artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Local_Bruno_Test_Report
          path: ${{ env.BRUNO_TEST_DIR }}/${{ env.BRUNO_REPORTS_DIR }}


  trigger_hxpr_version_update:
    name: Trigger hxpr-community-internal version update on HxPR
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-slim
    needs:
      - build
    steps:
      - name: Trigger version update on HxPR
        uses: benc-uk/workflow-dispatch@31e2b3319479a63f0ab15bf800eff9e913504e26 # v1.3.2
        with:
          repo: 'HylandSoftware/hxpr'
          ref: 'master'
          workflow: 'update-community-internal-version.yml'
          token: ${{ secrets.GH_CI_CD_PAT }}
          wait-for-completion: false
          sync-status: true
          inputs: >
            { "actor": "${{ env.GH_ACTOR }}", "communityInternalVersion": "${{ needs.build.outputs.version }}" }

  notify:
    runs-on: ubuntu-slim
    needs:
      - build
    if: always() && failure() && github.event_name == 'push'
    steps:
      - name: Teams Notification
        uses: Alfresco/alfresco-build-tools/.github/actions/send-teams-notification@1d671f8f10336861c89c67be57c6648d98876103 # v18.19.0
        with:
          webhook-url: ${{ secrets.TEAMS_GA_NOTIFS_WEBHOOK_URL }}
