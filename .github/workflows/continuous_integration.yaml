name: Continuous Integration - Build and test OpenArch and its Docker image.

on:
  push:
    branches:
      - main
  pull_request:
    types: [ opened, synchronize, reopened, ready_for_review ]
    branches:
      - main
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
permissions:
  contents: read
  packages: write
env:
  IMAGE_NAME: openarch-app-jvm

jobs:
  prepare_build:
    name: Prepare Build Metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Ensure SHA pinned actions
        uses: zgosalvez/github-actions-ensure-sha-pinned-actions@46cfe808a5f1588656ef299eedd0ce2fd7ec0dcc # v5.0.6
      - name: Generate Version
        id: version
        uses: ./.github/actions/generate-version
  build:
    name: Build and Test Docker Image
    runs-on: ubuntu-latest
    needs:
      - prepare_build
    env:
      VERSION: ${{ needs.prepare_build.outputs.version }}
      BRUNO_TEST_DIR: "./ftests/bruno-tests"
      BRUNO_REPORTS_DIR: "localTestResults"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Ensure SHA pinned actions
        uses: zgosalvez/github-actions-ensure-sha-pinned-actions@46cfe808a5f1588656ef299eedd0ce2fd7ec0dcc # v5.0.6
      - name: Login to ghcr.io in read only mode
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GH_HS_HX_RO_CLASSIC_TOKEN }}

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-
      - name: Set up JDK 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: '25'
          distribution: 'corretto'
      - name: Maven Settings (inc Nexus)
        uses: ./.github/actions/setup-maven
        with:
          nexus-username: ${{ secrets.NEXUS_USERNAME }}
          nexus-password: ${{ secrets.NEXUS_PASSWORD }}
      - name: Set Maven version to current build
        # processAllModules is required to support multiple parent poms
        run: mvn --no-transfer-progress versions:set -DnewVersion=${{ env.VERSION }} -DgenerateBackupPoms=false -DprocessAllModules=true
      - name: Compile project
        run: mvn clean install -DskipTests
      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          driver: docker-container
          # apply fix from https://github.com/moby/buildkit/issues/3969
          driver-opts: |
            network=host
      - name: Docker Compose Up
        id: compose
        working-directory: ./server/openarch-app
        run: docker compose up --quiet-pull -d
      - name: Build OpenArch Server with Maven
        run: |
          # Skip enforcer on PRs to allow SNAPSHOT dependencies from in-flight upstream PRs.
          mvn --no-transfer-progress -nsu verify \
          -f server/openarch-app -Plicense-check \
          -Dnuxeo.mongodb.server=$MONGODB_HOST:$MONGODB_PORT \
          -Dnuxeo.mongodb.dbname=unittests \
          ${{ github.event_name == 'pull_request' && '-Dopenarch.skip.enforcer=true' || '' }}
        env:
          # use localhost for the host here because we are running the job on the VM.
          MONGODB_HOST: localhost
          MONGODB_PORT: 27017

      - name: "Run mvn license plugin"
        run: mvn -nsu org.codehaus.mojo:license-maven-plugin:aggregate-add-third-party
      - name: "Download licenses"
        run: mvn -nsu org.codehaus.mojo:license-maven-plugin:aggregate-download-licenses -DlicensesOutputDirectory=./server/openarch-app/target/licenses
      - name: "Clone Alfresco/third-party-license-overrides"
        run: git clone --depth=1 https://github.com/Alfresco/third-party-license-overrides.git
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      - name: "Create third party license csv file and add it to the docker compose root directory"
        run: |
          python3 ./third-party-license-overrides/thirdPartyLicenseCSVCreator.py --project "${{ github.workspace }}" \
          --version "${{ env.VERSION }}" --combined --output "./server/openarch-app/target"

      - name: Docker Metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ghcr.io/hyland/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ env.VERSION }}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build Docker Image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./server/openarch-app
          file: ./server/openarch-app/src/main/docker/Dockerfile
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          push: false
          build-args: |
            BUILD_DATE=$(date -u "+%Y-%m-%dT%H:%M:%S")
            COMMIT_SHA=${{ github.sha }}
            BUILD_URL=https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

      - name: Login to ghcr.io in write mode
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Docker Image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./server/openarch-app
          file: ./server/openarch-app/src/main/docker/Dockerfile
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          push: true

      - name: Run Docker Image
        run: |
          docker run --rm -d -p 8080:8080 --name=OPENARCH_APP --network="host" \
          -e NUXEO_MONGODB_SERVER=$MONGODB_HOST:$MONGODB_PORT \
          -e NUXEO_DATA_DIR=/tmp \
          ghcr.io/hyland/${{ env.IMAGE_NAME }}:${{ env.VERSION }}
        env:
          # use localhost for the host here because we are running the job on the VM.
          MONGODB_HOST: localhost
          MONGODB_PORT: 27017
      - name: Wait for availability
        uses: ./.github/actions/wait-for-availability
        with:
          url: http://localhost:8080
      - name: Install Bruno CLI
        run: npm install -g @usebruno/cli@3.5.0 --ignore-scripts
      - name: Prepare Test Results
        working-directory: ${{ env.BRUNO_TEST_DIR }}
        run: mkdir -p ${BRUNO_REPORTS_DIR}
      - name: Run Bruno collection
        working-directory: ${{ env.BRUNO_TEST_DIR }}
        run: |
          bru run --env-file environments/openarch.localhost.json \
            --reporter-html ${BRUNO_REPORTS_DIR}/bruno_test_report.html
      - name: Retrieve Docker Logs
        if: always()
        working-directory: ${{ env.BRUNO_TEST_DIR }}
        run: docker logs OPENARCH_APP >> ${BRUNO_REPORTS_DIR}/docker_logs.txt
      - name: Dump docker logs on failure
        if: failure()
        uses: jwalton/gh-docker-logs@2741064ab9d7af54b0b1ffb6076cf64c16f0220e # v2.2.2
      - name: Stop Docker Image
        if: always()
        run: docker stop OPENARCH_APP
      - name: Docker Compose Down
        if: always() && steps.compose.conclusion == 'success'
        working-directory: server/openarch-app
        run: docker compose down
      # Upload the contents of test results directory to workspace
      - name: Upload Bruno test artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Local_Bruno_Test_Report
          path: ${{ env.BRUNO_TEST_DIR }}/${{ env.BRUNO_REPORTS_DIR }}
