name: Continuous Integration - Build and release the HXPR Community project. Trigger the CD workflow.

on:
  push:
    branches:
      - main
    paths:
      - 'modules/**'
      - 'server/**'
      - 'sonarcloud/**'
      - 'pom.xml'
  pull_request:
    types: [ opened, synchronize ]
    branches:
      - main
    paths:
      - 'modules/**'
      - 'server/**'
      - 'sonarcloud/**'
      - 'pom.xml'
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
permissions:
  actions: read
  contents: write
  packages: write
  id-token: write
  security-events: write
  pull-requests: write
env:
  GH_ACTOR: hxpcscicduser
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  GHCR: ghcr.io/hylandsoftware/
  IMAGE_NAME: hxpr-community-internal-app-jvm

jobs:
  build:
    name: Build and Test Docker Image
    runs-on: ubuntu-latest
    outputs:
      version: ${{ env.VERSION }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Ensure SHA pinned actions
        uses: zgosalvez/github-actions-ensure-sha-pinned-actions@ca46236c6ce584ae24bc6283ba8dcf4b3ec8a066 # v5.0.4
      - name: Login to ghcr.io in read only mode
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GH_PACKAGES_RO_PAT }}

      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-
      - name: Set up JDK 25
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version: '25'
          distribution: 'corretto'
          server-id: hylandsoftware-github
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
      - name: Maven Settings (inc Nexus)
        uses: ./.github/actions/setup-maven
        with:
          nexus-username: ${{ secrets.NEXUS_USERNAME }}
          nexus-password: ${{ secrets.NEXUS_PASSWORD }}
      - name: Generate Version
        id: version
        uses: ./.github/actions/generate-version
        with:
          base-version: '0.1'
      - name: Set VERSION in env (also used as docker tag)
        run: echo "VERSION=${{ steps.version.outputs.version }}" >> $GITHUB_ENV
      - name: Compile project
        run: mvn clean install -DskipTests
      - name: Set BRANCH_NAME and GITHUB_PR
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "BRANCH_NAME=${GITHUB_HEAD_REF}" >> $GITHUB_ENV
            echo "GITHUB_PR=true" >> $GITHUB_ENV
          else
            echo "BRANCH_NAME=${GITHUB_REF#refs/heads/}" >> $GITHUB_ENV
            echo "GITHUB_PR=false" >> $GITHUB_ENV
          fi
      - name: Release new HxPR version
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          RELEASE_USERNAME: ${{ env.GH_ACTOR }}
          RELEASE_USER_PAT: ${{ secrets.GH_CI_CD_PAT }}
          RELEASE_USER_EMAIL: "noreply@hyland.com"
          RELEASE_PREPARE: true
          RELEASE_PERFORM: false
          # RELEASE_PERFORM: true
          # DISTRIBUTION_REPO_URL: https://maven.pkg.github.com/HylandSoftware/hxpr-community-internal
          # RELEASE_PERFORM_WITH_CLASSIFIER: true
          # CLASSIFIER_PARAM: "-Pclassifier -Dclassifier.name=someclassifier"
        run: _ci/release.sh

      - name: Rebuild modules after release version bump
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: mvn clean install -DskipTests

      - name: Set Product version to current build
        run: sed -i 's/^org\.nuxeo\.ecm\.product\.version=.*$/org\.nuxeo\.ecm\.product\.version=${{ env.VERSION }}/g' ./server/hxpr-community-internal-app/src/main/resources/application.properties
      - name: Set up QEMU
        uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a # v4.0.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0
        with:
          driver: docker-container
          # apply fix from https://github.com/moby/buildkit/issues/3969
          driver-opts: |
            network=host
      - name: Docker Compose Up
        id: compose
        working-directory: ./server/hxpr-community-internal-app
        run: docker compose up --quiet-pull -d
      - name: Build HxPR Community Server with Maven
        run: |
          mvn --no-transfer-progress -nsu verify \
          -f server/hxpr-community-internal-app -Plicense-check \
          -Dnuxeo.mongodb.server=$MONGODB_HOST:$MONGODB_PORT \
          -Dnuxeo.mongodb.dbname=unittests
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # use localhost for the host here because we are running the job on the VM.
          MONGODB_HOST: localhost
          MONGODB_PORT: 27017
      - name: Login to ghcr.io in read only mode
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GH_PACKAGES_RO_PAT }}

      - name: Build Docker Image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: ./server/hxpr-community-internal-app
          file: ./server/hxpr-community-internal-app/src/main/docker/Dockerfile
          tags: ghcr.io/hylandsoftware/${{ env.IMAGE_NAME }}:${{ env.VERSION }}
          platforms: linux/amd64,linux/arm64
          push: false
          build-args: |
            BUILD_DATE=$(date -u "+%Y-%m-%dT%H:%M:%S")
            COMMIT_SHA=${{ github.sha }}
            BUILD_URL=https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

      - name: Login to ghcr.io in write mode
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Docker Image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: ./server/hxpr-community-internal-app
          file: ./server/hxpr-community-internal-app/src/main/docker/Dockerfile
          tags: ghcr.io/hylandsoftware/${{ env.IMAGE_NAME }}:${{ env.VERSION }}
          platforms: linux/amd64,linux/arm64
          push: true

  notify:
    runs-on: ubuntu-slim
    needs:
      - build
    if: always() && failure() && github.event_name == 'push'
    steps:
      - name: Teams Notification
        uses: Alfresco/alfresco-build-tools/.github/actions/send-teams-notification@684d64a56c85be82826d46ea1b95fa7c11dcc10c # v18.5.0
        with:
          webhook-url: ${{ secrets.TEAMS_GA_NOTIFS_WEBHOOK_URL }}
