name: Continuous Integration - Build and release the HXPR Community project. Trigger the CD workflow.

on:
  push:
    branches:
      - main
  pull_request:
    types: [ opened, synchronize ]
    branches:
      - main
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
permissions:
  actions: read
  contents: write
  packages: write
  id-token: write
  security-events: write
  pull-requests: write
env:
  GH_ACTOR: hxpcscicduser
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  build:
    name: Build and Test Docker Image
    runs-on: ubuntu-latest
    outputs:
      version: ${{ env.VERSION }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Ensure SHA pinned actions
        uses: zgosalvez/github-actions-ensure-sha-pinned-actions@d5d20e15f2736816ee0e001ba8b24b54d9ffcff4 # v5.0.0
      - name: Login to ghcr.io in read only mode
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GH_PACKAGES_RO_PAT }}

      - uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-
      - name: Set up JDK 25
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version: '25'
          distribution: 'corretto'
          server-id: hylandsoftware-github
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
      - name: Maven Settings (inc Nexus)
        uses: ./.github/actions/setup-maven
        with:
          nexus-username: ${{ secrets.NEXUS_USERNAME }}
          nexus-password: ${{ secrets.NEXUS_PASSWORD }}
      - name: Generate Version
        id: version
        uses: ./.github/actions/generate-version
        with:
          base-version: '2.1'
      - name: Set VERSION in env (also used as docker tag)
        run: echo "VERSION=${{ steps.version.outputs.version }}" >> $GITHUB_ENV
      - name: Compile project
        run: mvn clean install -DskipTests
      - name: Set BRANCH_NAME and GITHUB_PR
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "BRANCH_NAME=${GITHUB_HEAD_REF}" >> $GITHUB_ENV
            echo "GITHUB_PR=true" >> $GITHUB_ENV
          else
            echo "BRANCH_NAME=${GITHUB_REF#refs/heads/}" >> $GITHUB_ENV
            echo "GITHUB_PR=false" >> $GITHUB_ENV
          fi

  notify:
    runs-on: ubuntu-slim
    needs:
      - build
    if: always() && failure() && github.event_name == 'push'
    steps:
      - name: Teams Notification
        uses: Alfresco/alfresco-build-tools/.github/actions/send-teams-notification@6a31fc8a9e6ecf521d09eb05efbbe76541aed668 # v12.12.0
        with:
          webhook-url: ${{ secrets.TEAMS_GA_NOTIFS_WEBHOOK_URL }}
