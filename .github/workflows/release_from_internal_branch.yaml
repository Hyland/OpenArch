name: Internal branch - Release HxPR Community version

on:
  push:
    branches:
      - internal
    paths:
      - 'modules/**'
      - 'server/**'
      - 'sonarcloud/**'
      - 'pom.xml'
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
permissions:
  actions: read
  contents: write
  packages: write
  id-token: write
  security-events: write
  pull-requests: write
env:
  GH_ACTOR: hxpcscicduser
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  build:
    name: Build project and perform release from internal branch
    runs-on: ubuntu-latest
    outputs:
      version: ${{ env.VERSION }}
      released-tag: ${{ steps.capture-tag.outputs.released-tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-
      - name: Set up JDK 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: '25'
          distribution: 'corretto'
          server-id: hylandsoftware-github
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
      - name: Maven Settings (inc Nexus)
        uses: ./.github/actions/setup-maven
        with:
          nexus-username: ${{ secrets.NEXUS_USERNAME }}
          nexus-password: ${{ secrets.NEXUS_PASSWORD }}
      - name: Generate Version
        id: version
        uses: ./.github/actions/generate-version
        with:
          base-version: '0.1'
      - name: Set VERSION in env (also used as docker tag)
        run: echo "VERSION=${{ steps.version.outputs.version }}" >> $GITHUB_ENV
      - name: Compile project
        run: mvn clean install -DskipTests
      - name: Set BRANCH_NAME
        shell: bash
        run: |
          echo "BRANCH_NAME=${GITHUB_REF#refs/heads/}" >> $GITHUB_ENV
      - name: Release new HxPR version from internal branch
        env:
          RELEASE_USERNAME: ${{ env.GH_ACTOR }}
          RELEASE_USER_PAT: ${{ secrets.GH_CI_CD_PAT }}
          RELEASE_USER_EMAIL: "noreply@hyland.com"
          RELEASE_PREPARE: true
          RELEASE_PERFORM: true
          DISTRIBUTION_REPO_URL: https://maven.pkg.github.com/HylandSoftware/hxpr-community-internal
          RELEASE_PERFORM_WITH_CLASSIFIER: true
          CLASSIFIER_PARAM: "-Pclassifier -Dclassifier.name=internal"
        run: _ci/release.sh
      - name: Capture released tag
        id: capture-tag
        shell: bash
        run: |
          RELEASED_TAG=$(git tag --sort=-creatordate | head -n 1)
          echo "Released tag: ${RELEASED_TAG}"
          echo "released-tag=${RELEASED_TAG}" >> $GITHUB_OUTPUT

  publish:
    name: Publish artifacts to GH Packages
    needs:
      - build
    uses: ./.github/workflows/publish_maven_artifacts_to_gh_packages.yaml
    with:
      released-tag: ${{ needs.build.outputs.released-tag }}
    secrets:
      NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
      NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
      GH_CI_CD_PAT: ${{ secrets.GH_CI_CD_PAT }}

  trigger_hxpr_version_update:
    name: Trigger hxpr-community-internal version update on HxPR
    runs-on: ubuntu-slim
    needs:
      - build
      - publish
    steps:
      - name: Trigger version update on HxPR
        uses: benc-uk/workflow-dispatch@31e2b3319479a63f0ab15bf800eff9e913504e26 # v1.3.2
        with:
          repo: 'HylandSoftware/hxpr'
          ref: 'master'
          workflow: 'update-community-internal-version.yml'
          token: ${{ secrets.GH_CI_CD_PAT }}
          wait-for-completion: false
          sync-status: true
          inputs: >
            { "actor": "${{ env.GH_ACTOR }}", "communityInternalVersion": "${{ needs.build.outputs.version }}" }

  notify:
    runs-on: ubuntu-slim
    needs:
      - build
      - publish
    if: always() && failure() && github.event_name == 'push'
    steps:
      - name: Teams Notification
        uses: Alfresco/alfresco-build-tools/.github/actions/send-teams-notification@5177eca5d3d71342d7f7e0a2a4d74cc16b1eeb1b # v18.21.3
        with:
          webhook-url: ${{ secrets.TEAMS_GA_NOTIFS_WEBHOOK_URL }}
