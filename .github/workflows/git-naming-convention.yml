name: Git Convention Check

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, edited]
    branches:
      - main
      - internal
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  git-naming-convention:
    name: Git Convention Check
    if: ${{ !endsWith(github.event.pull_request.user.login, '[bot]') && github.event.pull_request.user.login != 'hxpcscicduser' && github.ref != 'refs/heads/internal' }}
    runs-on: ubuntu-latest
    env:
      PATTERN_MESSAGE: '(HXCS|HXTS|CCECM|CIN|CICGOV|CICVIEW)-[0-9]+'
      PATTERN_BRANCH: '^(improvement|bug|feature|test|tmp)\/(HXCS|HXTS|CCECM|CIN|CICGOV|CICVIEW)-[0-9]+[_-][A-Za-z0-9._-]+$'
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Get commit message
        id: get_commit_message
        shell: bash
        run: echo "result=$(git log --pretty=format:"%s" | head -1)" >> $GITHUB_OUTPUT

      - uses: bluwy/substitute-string-action@66aab512ea85c8215b45e20a14bf12da819c881e # v4.0.0
        id: sanitized_commit_message
        with:
          _input-text: ${{ steps.get_commit_message.outputs.result }}
          '`': "'"

      - name: Check commit message
        shell: bash
        run: |
          COMMIT_MSG="${{ steps.sanitized_commit_message.outputs.result }}"
          if [[ -n "$COMMIT_MSG" && ! "$COMMIT_MSG" =~ $PATTERN_MESSAGE ]]; then
            echo "Invalid commit message: $COMMIT_MSG"
            echo "Expected pattern: $PATTERN_MESSAGE"
            echo "Examples: \"HXCS-123 add test\" or \"CCECM-456 fix bug\""
            exit 1
          fi

      - name: Check branch name
        shell: bash
        run: |
          BRANCH_NAME="${{ github.head_ref }}"
          if [[ -n "$BRANCH_NAME" && ! "$BRANCH_NAME" =~ $PATTERN_BRANCH ]]; then
            echo "Invalid branch name: $BRANCH_NAME"
            echo "Expected pattern: $PATTERN_BRANCH"
            echo "Examples: \"improvement/HXCS-123-add-test\" or \"bug/CCECM-456-fix-bug\""
            exit 1
          fi

      - name: Check pull request title
        run: |
          PR_TITLE="${{ github.event.pull_request.title }}"
          if [[ ! $PR_TITLE =~ $PATTERN_MESSAGE ]]; then
            echo "Invalid pull request title: $PR_TITLE"
            echo "Expected pattern: $PATTERN_MESSAGE"
            echo "Examples: \"HXCS-123 add test\" or \"CCECM-456 fix bug\""
            exit 1
          fi

      - name: Ensure SHA pinned actions
        uses: zgosalvez/github-actions-ensure-sha-pinned-actions@3db98c0363e2fa5df3e1c4c471777a7c10b24cc9 # v5.0.5
        with:
          allowlist: HylandSoftware # do not enforce when referencing actions that we control

      - uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1
