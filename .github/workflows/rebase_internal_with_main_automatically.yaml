name: Rebase internal with main branch

on:
  workflow_dispatch:
  schedule:
    - cron: '15 10 * * MON-FRI'

env:
  GH_ACTOR: hxpcscicduser
  GH_ACTOR_EMAIL: "noreply@hyland.com"
  GH_TOKEN: ${{ secrets.GH_CI_CD_PAT }}

jobs:
  rebase-internal-with-main-branch:
    name: Rebase internal with main branch
    if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/internal' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          ref: internal

      - name: Rebase internal with main branch
        id: rebase
        run: |
          git config user.name "${{ env.GH_ACTOR }}"
          git config user.email "<${{ env.GH_ACTOR_EMAIL }}>"
          git fetch && git rebase origin/main

      - name: Push changes
        id: push
        if : ${{ steps.rebase.outcome == 'success' }}
        run: git push --force-with-lease origin internal
