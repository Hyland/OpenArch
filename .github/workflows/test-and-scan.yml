name: Test and Scan

on:
  push:
    branches:
      - main
      - internal
    paths:
      - 'modules/**'
      - 'server/**'
      - 'sonarcloud/**'
      - 'pom.xml'
  pull_request:
    types: [opened, synchronize, ready_for_review]
    branches:
      - main
      - internal
    paths:
      - 'modules/**'
      - 'server/**'
      - 'sonarcloud/**'
      - 'pom.xml'
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
env:
  LIGHTWEIGHT_TEST_COVERAGE_UPLOAD: lightweight-coverage-execs
  COVERAGE_OUTPUT_DIRECTORY: ${{ github.workspace }}/jacoco
  MAVEN_USERNAME: ${{ github.actor }}
  MAVEN_PASSWORD: ${{ secrets.GH_PACKAGES_RO_PAT }}
jobs:
  setup-test-matrices:
    name: Setup test matrices from JSON files
    runs-on: ubuntu-slim
    outputs:
      integration_common_matrix: ${{ steps.matrices.outputs.integration_common }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Read matrix configurations
        id: matrices
        run: |
          # Build matrix for community shards (type: "community")
          INTEGRATION_COMMON_JSON=$(jq -c '
            {
              include: [
                .include[]
              ]
            }
          ' .github/workflows/integration-shards.json)

          echo "integration_common=$INTEGRATION_COMMON_JSON" >> $GITHUB_OUTPUT
  build-artifacts:
    name: Build Maven artifacts for test execution
    runs-on: ubuntu-latest
    outputs:
      cache-key: ${{ steps.cache-key.outputs.key }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up JDK 25
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version: '25'
          distribution: 'corretto'
      - name: Generate cache key
        id: cache-key
        run: |
          # Create unique cache key based on workflow run, commit SHA, and pom files
          CACHE_KEY="workflow-${{ github.run_id }}-${{ github.sha }}-${{ hashFiles('**/pom.xml') }}"
          echo "key=$CACHE_KEY" >> $GITHUB_OUTPUT
          echo "Generated cache key: $CACHE_KEY"
      - name: Check for existing artifacts cache
        id: cache-check
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.m2/repository
          key: ${{ steps.cache-key.outputs.key }}
          lookup-only: true
      - name: Restore base Maven cache
        if: steps.cache-check.outputs.cache-hit != 'true'
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-
      - name: Maven Settings (inc Nexus)
        if: steps.cache-check.outputs.cache-hit != 'true'
        uses: ./.github/actions/setup-maven
        with:
          nexus-username: ${{ secrets.NEXUS_USERNAME }}
          nexus-password: ${{ secrets.NEXUS_PASSWORD }}
      - name: Build all artifacts
        if: steps.cache-check.outputs.cache-hit != 'true'
        run: |
          echo "Building all Maven artifacts for this workflow..."
          mvn --no-transfer-progress clean install -DskipTests \
            -Dnuxeo.skip.enforcer=true \
            -Dnuxeo.skip.enforcer.convergence=true
      - name: Save artifacts cache
        if: steps.cache-check.outputs.cache-hit != 'true'
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.m2/repository
          key: ${{ steps.cache-key.outputs.key }}
  test-maven-enforcer:
    name: Run maven enforcer tests and check licenses of dependencies
    runs-on: ubuntu-latest
    needs: build-artifacts
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
    - name: Restore workflow artifacts cache
      uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
      with:
        path: ~/.m2/repository
        key: ${{ needs.build-artifacts.outputs.cache-key }}
        fail-on-cache-miss: true
    - name: Set up JDK 25
      uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
      with:
        java-version: '25'
        distribution: 'corretto'
    - name: Maven Settings (inc Nexus)
      uses: ./.github/actions/setup-maven
      with:
        nexus-username: ${{ secrets.NEXUS_USERNAME }}
        nexus-password: ${{ secrets.NEXUS_PASSWORD }}
    - name: Test with Maven
      run: |
        mvn --no-transfer-progress -nsu -Plicense-check \
          enforcer:enforce@enforce-dependencies \
          enforcer:enforce@enforce-dependencies-convergence \
          generate-resources
  lightweight-test-suite:
    name: Run lightweight tests
    runs-on: ubuntu-latest
    needs: build-artifacts
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
    - name: Restore workflow artifacts cache
      uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
      with:
        path: ~/.m2/repository
        key: ${{ needs.build-artifacts.outputs.cache-key }}
        fail-on-cache-miss: true
    - name: Set up JDK 25
      uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
      with:
        java-version: '25'
        distribution: 'corretto'
    - name: Maven Settings (inc Nexus)
      uses: ./.github/actions/setup-maven
      with:
        nexus-username: ${{ secrets.NEXUS_USERNAME }}
        nexus-password: ${{ secrets.NEXUS_PASSWORD }}
    - name: Test with Maven
      run: |
        mvn --no-transfer-progress clean test -f modules \
        -Dlightweight-test-suite \
        -Dnuxeo.skip.enforcer=true \
        -Dnuxeo.skip.enforcer.convergence=true \
        -Pcoverage \
        -Dcoverage.reporting.outputDirectory=${COVERAGE_OUTPUT_DIRECTORY}
    - name: Echo Longest Tests run
      run: find . -name TEST-*.xml -exec grep -h testcase {} \; | awk -F '"' '{printf("%s#%s() - %.3fms\n", $4, $2, $6); }' | sort -n -k 3 | tail -20
    - name: Upload reports
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ${{ env.LIGHTWEIGHT_TEST_COVERAGE_UPLOAD }}
        path: ${{ env.COVERAGE_OUTPUT_DIRECTORY }}
  integration-test-suite-common:
    name: Run integration tests (Common modules, Shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    needs: [ build-artifacts, setup-test-matrices ]
    strategy:
      matrix: ${{ fromJson(needs.setup-test-matrices.outputs.integration_common_matrix) }}
      fail-fast: false
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Restore workflow artifacts cache
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.m2/repository
          key: ${{ needs.build-artifacts.outputs.cache-key }}
          fail-on-cache-miss: true
      - name: Set up JDK 25
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version: '25'
          distribution: 'corretto'
      - name: Login to GitHub Container Registry
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GH_PACKAGES_RO_PAT }}
      - name: For localstack emulation of SNS/SQS (see docker-compose.yml)
        run: sudo echo "127.0.0.1 localstack" | sudo tee -a /etc/hosts
      - name: Docker Compose Up
        id: compose
        working-directory: ./server/hxpr-community-internal-app
        run: |
          # Use the Community compose stack: common modules do not need transform services.
          echo "Starting Community services for common integration..."
          docker compose -f docker-compose.yml up --quiet-pull -d
      - name: Maven Settings (inc Nexus)
        uses: ./.github/actions/setup-maven
        with:
          nexus-username: ${{ secrets.NEXUS_USERNAME }}
          nexus-password: ${{ secrets.NEXUS_PASSWORD }}
      - name: Test common integration modules
        env:
          MONGODB_HOST: localhost
          MONGODB_PORT: 27017
          MONGODB_DBNAME: "unittests_integration_common_${{ matrix.shard }}"
          AWS_SQS_ENDPOINT: "http://localstack:4566"
          AWS_SNS_ENDPOINT: "http://localstack:4566"
        run: |
          # Convert comma-separated module list to Maven -pl format with : prefix
          MODULE_LIST=$(echo "${{ matrix.modules }}" | sed 's/,/,:/g' | sed 's/^/:/')

          # Keep profile-free: these are modules common to Community and enterprise.
          echo "Testing common modules: $MODULE_LIST"
          mvn --no-transfer-progress test -pl $MODULE_LIST \
          -Dintegration-test-suite \
          -Dnuxeo.skip.enforcer=true \
          -Dnuxeo.skip.enforcer.convergence=true \
          -Dnuxeo.test.core=mongodb \
          -Dnuxeo.mongodb.server=$MONGODB_HOST:$MONGODB_PORT \
          -Dnuxeo.mongodb.dbname=$MONGODB_DBNAME \
          -Pcoverage \
          -Dcoverage.reporting.outputDirectory=${COVERAGE_OUTPUT_DIRECTORY}/common-shard-${{ matrix.shard }}
      - name: Dump docker logs on failure
        if: failure()
        uses: jwalton/gh-docker-logs@2741064ab9d7af54b0b1ffb6076cf64c16f0220e # v2.2.2
      - name: Echo Longest Tests run
        run: find . -name TEST-*.xml -exec grep -h testcase {} \; | awk -F '"' '{printf("%s#%s() - %.3fms\n", $4, $2, $6); }' | sort -n -k 3 | tail -20
      - name: Upload reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: "${{ env.INTEGRATION_COMMON_TEST_COVERAGE_UPLOAD }}-shard-${{ matrix.shard }}"
          path: ${{ env.COVERAGE_OUTPUT_DIRECTORY }}/common-shard-${{ matrix.shard }}

  sonar-scan:
    name: "Scan project with sonar"
    runs-on: ubuntu-latest
    if: ${{ github.actor != 'dependabot[bot]' }}
    needs:
      - build-artifacts
      - test-maven-enforcer
      - lightweight-test-suite
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0 # full history required for scan
      - name: Restore workflow artifacts cache
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.m2/repository
          key: ${{ needs.build-artifacts.outputs.cache-key }}
          fail-on-cache-miss: true
      - name: Set up JDK 25
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version: '25'
          distribution: 'corretto'
          server-id: hylandsoftware-github
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: ${{ env.COVERAGE_OUTPUT_DIRECTORY }}
      - name: Generate Version
        id: version
        uses: ./.github/actions/generate-version
        with:
          base-version: '0.1'
      - name: Maven Settings (inc Nexus)
        uses: ./.github/actions/setup-maven
        with:
          nexus-username: ${{ secrets.NEXUS_USERNAME }}
          nexus-password: ${{ secrets.NEXUS_PASSWORD }}
      - name: Sonar scan
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          XML_REPORT_RELATIVE_PATH: sonarcloud/report-aggregate/target/site/jacoco-aggregate/jacoco.xml
        run: |
          mvn --no-transfer-progress install -DskipTests -Pcoverage \
          -Dcoverage.reporting.outputDirectory=${{ env.COVERAGE_OUTPUT_DIRECTORY }} \
          org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
          -Dsonar.coverage.jacoco.xmlReportPaths=${{ github.workspace }}/${{ env.XML_REPORT_RELATIVE_PATH }} \
          -Dsonar.projectName=hxcs \
          -Dsonar.projectKey=hxcs

  notify:
    runs-on: ubuntu-slim
    needs:
      - sonar-scan
    if: always() && failure() && github.event_name == 'push'
    steps:
      - name: Teams Notification
        uses: Alfresco/alfresco-build-tools/.github/actions/send-teams-notification@684d64a56c85be82826d46ea1b95fa7c11dcc10c # v18.5.0
        with:
          webhook-url: ${{ secrets.TEAMS_GA_NOTIFS_WEBHOOK_URL }}
