name: Publish maven artifacts to GH Packages (reusable)

on:
  workflow_call:
    inputs:
      released-tag:
        description: 'Git tag to check out and publish artifacts from'
        required: true
        type: string
    secrets:
      NEXUS_USERNAME:
        required: true
      NEXUS_PASSWORD:
        required: true
      GH_CI_CD_PAT:
        required: true

env:
  GH_ACTOR: hxpcscicduser

jobs:
  publish:
    name: Publish artifacts to GH Packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.released-tag }}

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-
      - name: Set up JDK 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: '25'
          distribution: 'corretto'
          server-id: hylandsoftware-github
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
      - name: Maven Settings (inc Nexus)
        uses: ./.github/actions/setup-maven
        with:
          nexus-username: ${{ secrets.NEXUS_USERNAME }}
          nexus-password: ${{ secrets.NEXUS_PASSWORD }}
      - name: Compile project
        run: mvn clean install -DskipTests
      - name: Publish to GH Packages
        env:
          GH_ACTOR: ${{ env.GH_ACTOR }}
          GITHUB_TOKEN: ${{ secrets.GH_CI_CD_PAT }}
        run: |
          mvn --batch-mode deploy \
            -DskipTests \
            -Prelease \
            -DrepositoryId=ghcr.io \
            -Ddistribution-repository.url=https://maven.pkg.github.com/HylandSoftware/hxpr-community-internal
