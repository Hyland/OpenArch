name: Publish maven artifacts to GH Packages (reusable)

on:
  workflow_call:
    inputs:
      released-tag:
        description: 'Git tag to check out and publish artifacts from'
        required: true
        type: string
    secrets:
      NEXUS_USERNAME:
        required: true
      NEXUS_PASSWORD:
        required: true
      GH_CI_CD_PAT:
        required: true

env:
  GH_ACTOR: hxpcscicduser

jobs:
  publish:
    name: Publish artifacts to GH Packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          ref: ${{ inputs.released-tag }}

      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-
      - name: Set up JDK 25
        uses: actions/setup-java@ad2b38190b15e4d6bdf0c97fb4fca8412226d287 # v5.3.0
        with:
          java-version: '25'
          distribution: 'corretto'
          server-id: hylandsoftware-github
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
      - name: Maven Settings (inc Nexus)
        uses: ./.github/actions/setup-maven
        with:
          nexus-username: ${{ secrets.NEXUS_USERNAME }}
          nexus-password: ${{ secrets.NEXUS_PASSWORD }}
      - name: Compile project
        run: mvn clean install -DskipTests
      - name: Publish to GH Packages
        env:
          GH_ACTOR: ${{ env.GH_ACTOR }}
          GITHUB_TOKEN: ${{ secrets.GH_CI_CD_PAT }}
        run: |
          mvn --batch-mode deploy \
            -DskipTests \
            -Prelease \
            -DrepositoryId=ghcr.io \
            -Ddistribution-repository.url=https://maven.pkg.github.com/HylandSoftware/hxpr-community-internal
