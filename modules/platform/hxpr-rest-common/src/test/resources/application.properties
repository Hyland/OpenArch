# Nucleus configuration
nucleus.url=http://127.0.0.1:3002
nucleus.system.integration.user.mappings=/system-integrations/principal-users/{principalUserId}/user-mappings
nucleus.system.integration.user.membership=/system-integrations/principal-users/{principalUserId}/membership

# IDP user directory config
idp.url=http://localhost:5002
idp.token=${idp.url}/idp/connect/token
idp.test.token=${idp.token}

idp.directory=${idp.url}/directory/graphql
idp.userinfo=${idp.url}/idp/connect/userinfo
#idp.subscription.token.exchange.version=v3
idp.subscription.app=hxprApp
idp.subscription.environment=subscription1
idp.subscription.client.id=subscription-client
idp.subscription.client.secret=secret
idp.scope=openid profile hxp hxpr profile.attributes
idp.test.username=testuser
idp.test.password=password
idp.test.client-id=nuxeo-client
idp.test.client-secret=secret
idp.internal.service.user.client.id=idp-hxpr-client
idp.internal.service.user.client.secret=notsosecret
idp.internal.service.environment=subscription1
idp.internal.service.scope=hxp hxpr environment_authorization

# IDP user directory config
spring.security.oauth2.resourceserver.jwt.issuer-uri=${JWT_ISSUER_URIS:${idp.url}/idp}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${idp.url}/idp/.well-known/openid-configuration/jwks
spring.security.oauth2.resourceserver.jws-type-verifier=at+jwt
spring.security.oauth2.resourceserver.jwt.jwk-connect-timeout=10000
spring.security.oauth2.resourceserver.jwt.jwk-read-timeout=10000
