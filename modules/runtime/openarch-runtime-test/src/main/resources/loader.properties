
# whether or not to extract embeded jars
com.hyland.openarch.runtime.loader.extractNestedJARs=true

# whether to scan for nested jars or to use Bundle-ClassPath when extracting nested jars
com.hyland.openarch.runtime.loader.scanForNestedJARs=true

# a directory containing standard jars
#com.hyland.openarch.runtime.loader.lib=lib

# where runtime application data is stored (persistence, temp data etc)
#com.hyland.openarch.runtime.loader.data=data

# directory containing nuxeo runtime osgi bundles
#com.hyland.openarch.runtime.loader.bundles=bundles

# directory containing config data
#com.hyland.openarch.runtime.loader.config=config

# the main class to load
#com.hyland.openarch.runtime.loader.main=
