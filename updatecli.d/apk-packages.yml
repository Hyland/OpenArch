name: Update pinned apk package versions in hxpr-app Dockerfile

sources:
  curl_version:
    kind: shell
    spec:
      command: |
        ALPINE_VERSION=$(sed -nE 's|^FROM [^ ]*-alpine([0-9]+\.[0-9]+).* AS builder$|\1|p' server/hxpr-community-internal-app/src/main/docker/Dockerfile | head -n1)
        if [ -z "${ALPINE_VERSION}" ]; then
          echo "Unable to determine Alpine version from Dockerfile builder stage" >&2
          exit 1
        fi
        curl -fsSL "https://dl-cdn.alpinelinux.org/alpine/v${ALPINE_VERSION}/main/x86_64/APKINDEX.tar.gz" \
          | tar -xzO APKINDEX \
          | awk -v RS= '/(^|\n)P:curl(\n|$)/' \
          | sed -n 's/^V://p' \
          | head -n1

targets:
  update_curl_arg:
    name: Update curl version in Dockerfile apk add
    kind: file
    sourceid: curl_version
    spec:
      file: server/hxpr-community-internal-app/src/main/docker/Dockerfile
      matchpattern: 'apk add --no-cache curl=([^ \\]+)'
      replacepattern: 'apk add --no-cache curl={{ source "curl_version" }}'
