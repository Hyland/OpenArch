## Spring conf
springboot.app.version=@project.version@
springboot.app.name=@project.artifactId@
springboot.app.productVersion=${org.nuxeo.ecm.product.version}
spring.main.allow-bean-definition-overriding=true

# OpenApi
# Default value for enabled is true, but added here for reference
springdoc.api-docs.enabled=true
springdoc.api-docs.version=openapi_3_0

# Swagger
# Default value for enabled is true, but added here for reference
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.operations-sorter=alpha
springdoc.writer-with-order-by-keys=true

# set by GH Action build
org.nuxeo.ecm.product.version=0.0.2-SNAPSHOT

# Actuator
management.endpoints.web.exposure.include=info,health,loggers
management.endpoint.info.enabled=${info.pages.debug.enabled}
management.info.build.enabled=false
management.info.git.enabled=false
management.endpoint.health.probes.enabled=true

info.pages.debug.enabled=false

# Logging
hxpr.log.level=INFO
logging.level.org.nuxeo=${hxpr.log.level}
logging.level.com.hyland.hxpr=${hxpr.log.level}

##-----------------------------------------------------------------------------
## General parameters
##-----------------------------------------------------------------------------

nuxeo.server.dir=nxserver
nuxeo.data.dir=nxserver/data
nuxeo.url=http://localhost:8080
org.nuxeo.ecm.contextPath=
org.nuxeo.ecm.product.name=Hyland Experience Platform Repository Community
# used for runningstatus check
nuxeo.server.http.port=8080

# Strict startup: shut down if runtime errors at startup
nuxeo.runtime.startup.strict=true

# CORS
hxpr.http.cors.origins=*

# Response buffering while the request transaction commits, in bytes
# A commit failure can only be turned into an error response while the whole body is still buffered; bigger
# bodies, and downloads, stream straight through instead. Default is 65536 (64 KB)
#hxpr.transaction.response.buffer.size=65536

##-----------------------------------------------------------------------------
## Blob Provider
##-----------------------------------------------------------------------------
nuxeo.core.binarymanager=org.nuxeo.ecm.core.blob.LocalBlobProvider

# Cron expression for the scheduled blob garbage collector
#hxpr.blob.gc.scheduler.cron=0 0 2 * * ?

##-----------------------------------------------------------------------------
## MongoDB
##-----------------------------------------------------------------------------

#nuxeo.dbs.min-pool-size=0
#nuxeo.dbs.max-pool-size=20
#nuxeo.dbs.blocking-timeout-millis=100
#nuxeo.dbs.fulltext.disabled=false
#nuxeo.dbs.fulltext.storedInBlob=false
#nuxeo.dbs.fulltext.fieldSizeLimit=15728640
#nuxeo.dbs.cache.maxSize=1000
#nuxeo.dbs.cache.concurrencyLevel=10
#nuxeo.dbs.cache.ttl=10
## Database transaction timeout in seconds
nuxeo.db.transactiontimeout=300

nuxeo.mongodb.server=localhost:27017
#nuxeo.mongodb.server=mongodb://[username:password@]host1[:port1][,host2[:port2],...[,hostN[:portN]]][/[database][?options]]
nuxeo.mongodb.dbname=nuxeo
# MongoDB Connection settings
#nuxeo.mongodb.maxConnectionIdleTimeSec=600
#nuxeo.mongodb.maxConnectionLifeTimeSec=3600

# TLS/SSL configuration
#nuxeo.mongodb.ssl=false
#nuxeo.mongodb.truststore.path=
#nuxeo.mongodb.truststore.password=
#nuxeo.mongodb.truststore.type=JKS
#nuxeo.mongodb.keystore.path=
#nuxeo.mongodb.keystore.password=
#nuxeo.mongodb.keystore.type=JKS

##-----------------------------------------------------------------------------
## OpenSearch
##-----------------------------------------------------------------------------

opensearch.use.undertow=true
# Name of the OpenSearch index for the default document repository
#opensearch.indexName=nuxeo
#opensearch.vocabularies.indexName=nuxeo_vocabularies
#opensearch.configuration.indexName=nuxeo_configuration
# Comma separated list of OpenSearch nodes, keep empty when embedded
## node format for RestClient is http://server:9200
## node format for TransportClient is server:9300
opensearch.addressList=http://localhost:9200
# Name of the OpenSearch cluster to join
opensearch.clusterName=nuxeoCluster
# Number of replicas (0 for embedded, >= 1 otherwise)
opensearch.indexNumberOfReplicas=0
# Number of shards of the main document index (1 for embedded, more otherwise)
opensearch.indexNumberOfShards=1
# Number of shards of the other indexes, defaulted per index in opensearch-config.xml
opensearch.vocabularies.indexNumberOfShards=1
opensearch.configuration.indexNumberOfShards=1
opensearch.embeddings.indexNumberOfShards=1
# Load document model from OpenSearch result (experimental)
# if false load from document from VCS
opensearch.fetchDocFromEs=false
# Reindexing option, number of documents to process per worker @since 6.0-HF02
opensearch.reindex.bucketReadSize=500
# Reindexing option, number of documents to submit to OpenSearch per bulk command @since 6.0-HF02
opensearch.reindex.bucketWriteSize=100
# Maximum size of the indexing thread pool @since 6.0-HF02
opensearch.indexing.maxThreads=4
# Time to keep the completed indexing worker states @since 6.0-HF02
opensearch.indexing.clearCompletedAfterSeconds=90
# Reindex the repository content on startup if the index is empty
opensearch.reindex.onStartup=false
# Refresh interval for the health check
nuxeo.healthcheck.refresh.interval.seconds=20
# Limits the maximum number of fields that can be defined in an index mapping. Defaults to 1000.
#opensearch.index.mapping.total_fields.limit=1000
# Default request durability means that OpenSearch is doing one fsync per request. With async durability it is one fsync every 5s.
#opensearch.index.translog.durability=request
# For the rest client, a timeout in milliseconds until a connection is established
#opensearch.restClient.connectionTimeoutMs=30000
# For the rest client, a maximum period, in milliseconds, of inactivity between two consecutive data packets
#opensearch.restClient.socketTimeoutMs=20000
# For the rest client, the timeout for requesting a connection from the connection manager (connection pool)
#opensearch.restClient.connectionPoolTimeoutMs=10000
# For the rest client, the maximum number of concurrent connections to a specific host (an OpenSearch node)
#opensearch.restClient.maxConnPerRoute=10
# For the rest client, the total maximum number of concurrent connections across all hosts in the cluster
#opensearch.restClient.maxConnTotal=30
# A username for client basic authentication
opensearch.restClient.username=
# A password for client basic authentication
opensearch.restClient.password=
# TLS/SSL trustStore/keyStore configuration
#opensearch.restClient.truststore.path=
#opensearch.restClient.truststore.password=
#opensearch.restClient.truststore.type=JKS
#opensearch.restClient.keystore.path=
#opensearch.restClient.keystore.password=
#opensearch.restClient.keystore.type=JKS

# HxRP managing index alias
#opensearch.manageAlias.enabled=false
# Bulk Index action, fetching content (bulk/index computation)
opensearch.bulk.index.fetch.concurrency=4
opensearch.bulk.index.fetch.partitions=12
# Bulk Index action, submitting requests to open (bulk/bulkIndex computation)
opensearch.bulk.index.submit.concurrency=2
opensearch.bulk.index.submit.partitions=8

# Clustering
nuxeo.cluster.enabled=false
nuxeo.binarystores.root=${nuxeo.data.dir}

# Metrics (disabled by default)
metrics.enabled=false

# User store
hxpr.users.file=classpath:hxpr-users.yml

# Upload Api configuration:
hxp.rest.upload.uri.allowedHeadersList=Authorization
