services:
  mongodb:
    image: mongo:7.0.37@sha256:8ecb514b00bdcc0bde67ef4e6c330385377a9dc68e24ee94e28c07c891647348
    hostname: mongo
    ports:
      - "27017:27017"
    volumes:
      - mongodb-data:/data/db

  opensearch:
    image: opensearchproject/opensearch:2.19.6@sha256:b485da5f7f7bcb174523954bae1303c8c2ddaae9f1c2c89f10d625c98544e7cd
    hostname: opensearch
    environment:
      - "discovery.type=single-node"
      - "cluster.routing.allocation.disk.threshold_enabled=false"
      - "plugins.security.disabled=true"
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
      - "OPENSEARCH_INITIAL_ADMIN_PASSWORD=af7J2N2njFgS%3"
    ports:
      - "9200:9200"
      - "9600:9600"
    healthcheck:
      test: [ "CMD-SHELL", "curl -fs 'http://localhost:9200/_cluster/health?wait_for_status=green&timeout=5s'" ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:2.19.6@sha256:3616df0a80eb458ccb1fa028750a51bf9f525b4c49f30e902f6ed108ada7a6e5
    container_name: opensearch-community-dashboards
    ports:
      - 5601:5601
    expose:
      - "5601"
    environment:
      - 'OPENSEARCH_HOSTS=["http://opensearch:9200"]'
      - "DISABLE_SECURITY_DASHBOARDS_PLUGIN=true"
    depends_on:
      opensearch:
        condition: service_healthy

volumes:
  mongodb-data:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: size=1g
