services:
  mongodb:
    image: mongo:7.0.34@sha256:4b5bf3c2bb7516164f6dcb44acce4fdcb428abfe5771a1128304a0f34ab9ff7c
    hostname: mongo
    ports:
      - "27017:27017"
    volumes:
      - mongodb-data:/data/db

volumes:
  mongodb-data:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: size=1g
