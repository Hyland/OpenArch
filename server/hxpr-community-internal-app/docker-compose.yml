services:
  mongodb:
    image: mongo:7.0.37@sha256:8ecb514b00bdcc0bde67ef4e6c330385377a9dc68e24ee94e28c07c891647348
    hostname: mongo
    ports:
      - "27017:27017"
    volumes:
      - mongodb-data:/data/db

  opensearch:
    image: opensearchproject/opensearch:2.19.5@sha256:e225ca1a828ef054e0335a0c234198a7b8f80abcc90f1159273ca7be5d8bbdff
    hostname: opensearch
    environment:
      - "discovery.type=single-node"
      - "cluster.routing.allocation.disk.threshold_enabled=false"
      - "plugins.security.disabled=true"
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
      - "OPENSEARCH_INITIAL_ADMIN_PASSWORD=af7J2N2njFgS%3"
    ports:
      - "9200:9200"
      - "9600:9600"
    healthcheck:
      test: [ "CMD-SHELL", "curl -fs 'http://localhost:9200/_cluster/health?wait_for_status=green&timeout=5s'" ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:2.19.5@sha256:20652662499b7d9cc9f583a4fa602064a6d0eccdc978c5dc14c816dc3350da5e
    container_name: opensearch-community-dashboards
    ports:
      - 5601:5601
    expose:
      - "5601"
    environment:
      - 'OPENSEARCH_HOSTS=["http://opensearch:9200"]'
      - "DISABLE_SECURITY_DASHBOARDS_PLUGIN=true"
    depends_on:
      opensearch:
        condition: service_healthy

volumes:
  mongodb-data:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: size=1g
